<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HDOX Viewer</title>
  <style>
    body { margin: 0; display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
    iframe { width: 100%; height: 100%; border: 0; }
    aside { border-left: 1px solid #ccc; padding: 1rem; overflow: auto; }
    #drop { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; z-index: 2; }
  </style>
</head>
<body>
  <div id="drop">Drop a .hdox file here</div>
  <iframe id="viewer" title="HDOX document" sandbox="allow-same-origin"></iframe>
  <aside><button id="print">Print / Save PDF</button><pre id="inspector"></pre></aside>
  <script type="module">
    import { readHDOX, HDOXViewer } from "../sdk-ts/dist/index.js";
    const drop = document.querySelector("#drop");
    const iframe = document.querySelector("#viewer");
    const inspector = document.querySelector("#inspector");
    const viewer = new HDOXViewer();
    drop.addEventListener("dragover", event => event.preventDefault());
    drop.addEventListener("drop", async event => {
      event.preventDefault();
      const file = event.dataTransfer.files[0];
      if (!file) return;
      try {
        const archive = readHDOX(new Uint8Array(await file.arrayBuffer()));
        await viewer.render(archive, iframe);
        inspector.textContent = JSON.stringify(viewer.inspect(archive), null, 2);
        drop.style.display = "none";
      } catch (error) {
        inspector.textContent = String(error);
      }
    });
    document.querySelector("#print").addEventListener("click", () => viewer.print(iframe));
  </script>
</body>
</html>
