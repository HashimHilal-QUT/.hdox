[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdox"
version = "1.0.0"
description = "Portable, code-native document format: PDF-grade layout with an AI-readable HTML core"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.18",
  "Markdown>=3.5",
  "PyYAML>=6.0",
  "cryptography>=41",
]

[project.optional-dependencies]
pdf = ["weasyprint==70.0", "pypdf>=4"]
dev = ["pytest>=7", "weasyprint==70.0", "pypdf>=4"]

[project.scripts]
hdox = "hdox.cli:main"

[tool.setuptools]
packages = ["hdox"]

[tool.setuptools.package-data]
hdox = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
