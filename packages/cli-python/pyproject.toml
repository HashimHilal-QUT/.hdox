[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdox"
version = "0.1.0"
description = "Offline portable semantic document format"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.18",
  "Markdown>=3.5",
  "PyYAML>=6.0",
  "cryptography>=48.0.1",
]

[project.scripts]
hdox = "hdox.cli:main"
